<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a120e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="sbStyle">
<meta name="apple-mobile-web-app-title" content="MyMONEY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>MyMONEY</title>
<script>
/* read the saved look before anything is painted, so the right theme shows from the first frame */
(function () {
  try {
    var s = (JSON.parse(localStorage.getItem('budget.v1') || '{}').settings) || {};
    var th = s.theme || 'dark';
    var light = th === 'light' || (th === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
    window.__look = { light: light, mono: s.palette === 'mono', sys: s.font === 'system',
      glass: s.style !== 'solid' && !(window.matchMedia && matchMedia('(prefers-reduced-transparency: reduce)').matches) };
    if (light) {
      document.getElementById('sbStyle').setAttribute('content', 'default');
      document.querySelector('meta[name=theme-color]').setAttribute('content', '#f2f6f3');
    }
  } catch (e) { window.__look = { light: false, mono: false, sys: false, glass: true }; }
})();
</script>
<style>
/* Onest: open source (SIL OFL), bundled locally so it works offline */
@font-face{font-family:"Onest";font-style:normal;font-weight:100 900;font-display:swap;
  src:url("fonts/onest-latin-wght-normal.woff2") format("woff2-variations"),url("fonts/onest-latin-wght-normal.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Onest";font-style:normal;font-weight:100 900;font-display:swap;
  src:url("fonts/onest-latin-ext-wght-normal.woff2") format("woff2-variations"),url("fonts/onest-latin-ext-wght-normal.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

/* ---------- design tokens: dark (default) ---------- */
:root{
  --bg:#0a120e; --top-glow:#123222;
  --surface:#111c16; --surface2:#16241c; --line:#21352a;
  --text:#e8f3ec; --muted:#a2bcaf; --faint:#7a9386;
  --accent:#3ddc84; --accent-soft:#0f2a1c; --accent-ink:#04200f;
  --needs:#3ddc97; --wants:#d58cff; --savings:#f5c451; --savings2:#e3923a; --over:#f87171; --del-ink:#2a0606;
  --row-base:#121c17; --row-sub:#0f1813; --sep:rgba(255,255,255,.06);
  --hero-1:#15392a; --hero-2:#112219; --hero-line:#24442f; --chip-line:#2c5a3f;
  --scrim:rgba(2,8,5,.7); --shadow:rgba(0,0,0,.25);
  --g-base:#06100b; --g-hi:rgba(255,255,255,.13); --g-1:rgba(255,255,255,.09); --g-2:rgba(255,255,255,.03); --g-3:rgba(255,255,255,.015);
  --g-line:rgba(255,255,255,.14); --g-inset:rgba(255,255,255,.30); --g-shadow:rgba(0,0,0,.6);
  --g-row:#0d1712; --g-row-sub:#0b140f; --g-sheet:rgba(16,28,21,.66); --g-btn-1:rgba(255,255,255,.14); --g-btn-2:rgba(255,255,255,.05);
  --g-input:rgba(0,0,0,.22); --g-input-line:rgba(255,255,255,.10);
  --blob1:rgba(61,220,151,.42); --blob2:rgba(213,140,255,.34); --blob3:rgba(245,196,81,.26); --blob4:rgba(45,212,191,.28);
  --splash:#0b0b0d;
  --radius:20px;
  --system:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --font:"Onest",var(--system);
  color-scheme:dark;
}
body.mono{--needs:#2fd47c;--wants:#8eeab3;--savings:#cdf7de;--savings2:#5cc08a;
  --blob2:rgba(61,220,151,.22);--blob3:rgba(140,234,179,.16);--blob4:rgba(45,180,120,.26)}
/* ---------- light theme ---------- */
body.light{
  --bg:#f2f6f3; --top-glow:#d9f1e3;
  --surface:#ffffff; --surface2:#eef3f0; --line:#d9e4dd;
  --text:#0f1a14; --muted:#56695f; --faint:#86978d;
  --accent:#139a52; --accent-soft:#e1f5e9; --accent-ink:#ffffff;
  --needs:#11a35e; --wants:#9b4fd8; --savings:#c98d07; --savings2:#c4651a; --over:#dc3f3f; --del-ink:#ffffff;
  --row-base:#ffffff; --row-sub:#f6f9f7; --sep:rgba(0,0,0,.07);
  --hero-1:#d6f2e2; --hero-2:#ecf8f1; --hero-line:#bfe3cd; --chip-line:#a9dcbd;
  --scrim:rgba(20,30,25,.35); --shadow:rgba(20,40,30,.12);
  --g-base:#e9f1ec; --g-hi:rgba(255,255,255,.8); --g-1:rgba(255,255,255,.66); --g-2:rgba(255,255,255,.42); --g-3:rgba(255,255,255,.3);
  --g-line:rgba(255,255,255,.95); --g-inset:rgba(255,255,255,1); --g-shadow:rgba(30,60,45,.16);
  --g-row:#fbfdfc; --g-row-sub:#f3f8f5; --g-sheet:rgba(248,251,249,.8); --g-btn-1:rgba(255,255,255,.9); --g-btn-2:rgba(255,255,255,.6);
  --g-input:rgba(255,255,255,.7); --g-input-line:rgba(15,40,25,.10);
  --blob1:rgba(61,220,151,.34); --blob2:rgba(213,140,255,.26); --blob3:rgba(245,196,81,.30); --blob4:rgba(45,212,191,.24);
  --splash:#f4f7f5;
  color-scheme:light;
}
body.light.mono{--needs:#0f8f4c;--wants:#3bb574;--savings:#7fd1a3;--savings2:#2a9a60;
  --blob2:rgba(61,220,151,.2);--blob3:rgba(120,210,160,.22);--blob4:rgba(40,170,110,.2)}
body.font-system{--font:var(--system)}

*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  min-height:100vh;min-height:100dvh;line-height:1.35;
  background:radial-gradient(120% 50% at 50% -8%,var(--top-glow) 0%,transparent 62%),var(--bg);background-repeat:no-repeat;
  color:var(--text);font-family:var(--font);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font-family:var(--font)}
.app{max-width:560px;margin:0 auto;
  padding:0 calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 16px)}

/* ---------- top row + month ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 2px 2px}
.topbar h1{font-size:32px;font-weight:700;letter-spacing:-.01em;color:var(--accent);line-height:1.1}
.icon-btn{width:44px;height:44px;flex:none;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.icon-btn svg{width:22px;height:22px}
.icon-btn:active{background:var(--surface2)}
.badge-dot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--savings);box-shadow:0 0 0 2px var(--bg)}
.month-nav{display:flex;align-items:center;gap:8px;margin:12px 0 14px}
.month-label{flex:1;min-width:0;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative}
.month-label .m{font-size:18px;font-weight:600}
.month-label.away::after{content:"";position:absolute;top:8px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
main{display:block}
main.in-next{animation:inNext .26s ease}
main.in-prev{animation:inPrev .26s ease}
@keyframes inNext{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.card-head h2{font-size:23px;font-weight:700;color:var(--c,var(--text))}
.hero{--c:var(--accent);background:linear-gradient(165deg,var(--hero-1) 0%,var(--hero-2) 55%,var(--surface) 100%);border-color:var(--hero-line)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.big{font-size:clamp(32px,11vw,46px);font-weight:700;line-height:1.15;margin-top:10px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--chip-line);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 12px;font-size:15px;font-weight:600;white-space:nowrap}
.stack{display:flex;height:12px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:20px 0 12px}
.seg{height:100%;transition:width .35s ease}
.seg.needs{background:var(--needs)}.seg.wants{background:var(--wants)}.seg.savings{background:var(--savings)}
.legend{display:flex;flex-wrap:wrap;gap:9px 18px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.legend b{color:var(--text);font-weight:600}
.unalloc{margin-top:14px;font-size:15px;color:var(--muted)}
.unalloc b{color:var(--text)}
.unalloc b.over{color:var(--over)}
.sub-title{margin-top:22px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero .items{margin-top:10px}

.cat{--c:var(--needs);background:var(--surface);
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 15%,var(--surface)) 0%,var(--surface) 62%);
  border-color:color-mix(in srgb,var(--c) 28%,var(--line))}
.cat.needs{--c:var(--needs)}.cat.wants{--c:var(--wants)}.cat.savings{--c:var(--savings)}
.cat-head{display:flex;flex-direction:row-reverse;align-items:center;gap:18px;margin-top:14px}
.ring{position:relative;width:70px;height:70px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:3.6}
.ring .track{stroke:color-mix(in srgb,var(--c) 16%,var(--surface2))}
.ring .prog{stroke:var(--c);stroke-linecap:round;transition:stroke-dasharray .45s ease,stroke-dashoffset .45s ease,stroke .2s;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--c) 45%,transparent))}
.ring .prog.over{stroke:var(--over);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--over) 45%,transparent))}
.ring .prog.liq,.ring .prog.inv{stroke-linecap:butt}
.ring .prog.inv{stroke:var(--savings2);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--savings2) 45%,transparent))}
.ring-label{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.cat-info{flex:1;min-width:0}
.fig{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.of{margin-top:5px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.left{display:block;min-height:19px;margin-top:6px;font-size:14px;font-weight:600;color:var(--muted)}
.left.over{color:var(--over)}
.left.good{color:var(--c)}

/* ---------- lists: read-only rows, tap to edit, swipe left to delete, groups for repeated purchases ---------- */
.items{margin-top:16px;border-radius:16px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 18%,var(--line));
  --row:color-mix(in srgb,var(--c) 6%,var(--row-base))}
.item{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.item-inner{position:relative;z-index:1;display:flex;align-items:center;gap:12px;min-height:52px;padding:11px 16px;background:var(--row);transition:transform .22s ease;cursor:pointer}
.item + .item .item-inner{box-shadow:inset 0 1px 0 var(--sep)}
.item-inner:active{background:color-mix(in srgb,var(--c) 12%,var(--row-base))}
.item-name{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.item-name small,.item-name .meta{display:block;margin-top:2px;font-size:13px;color:var(--faint);font-weight:400;white-space:normal}
.item-amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item-amt.zero{color:var(--faint);font-weight:400}
.swatch{width:10px;height:10px;border-radius:50%;flex:none}
.item-del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:var(--over);color:var(--del-ink);font-weight:700;font-size:15px;visibility:hidden;transition:visibility 0s .22s}
.item.open .item-del,.item.swiping .item-del{visibility:visible;transition:none}
.empty{padding:14px 16px;font-size:14px;color:var(--faint);background:var(--row)}
.ic{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.ic svg{width:20px;height:20px}
.count{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);vertical-align:1px}
.rec{display:inline-block;width:13px;height:13px;margin-left:6px;vertical-align:-1px;color:var(--faint)}
.chev{width:16px;height:16px;color:var(--faint);transition:transform .2s;flex:none;margin-left:-4px}
.item.group.expanded .chev{transform:rotate(90deg)}
.item.sub .item-inner{padding-left:64px;min-height:44px;background:color-mix(in srgb,var(--c) 3%,var(--row-sub))}
.item.sub .item-name{font-size:15px;color:var(--muted)}
.item.sub .item-amt{font-size:15px;font-weight:500}

/* quick-add chips + add button */
.chips{display:flex;gap:8px;margin:12px -18px 0;padding:0 18px 2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip-q{flex:none;display:flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 5px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--c) 26%,var(--line));background:color-mix(in srgb,var(--c) 8%,transparent);
  font-size:14px;font-weight:600;color:var(--text);white-space:nowrap}
.chip-q .ic{width:30px;height:30px}
.chip-q .ic svg{width:17px;height:17px}
.chip-q em{font-style:normal;font-weight:500;color:var(--muted)}
.chip-q:active{background:color-mix(in srgb,var(--c) 18%,transparent)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;margin-top:12px;border-radius:15px;
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);
  color:var(--c);font-size:16px;font-weight:700}
.add-btn svg{width:18px;height:18px}
.add-btn:active{background:color-mix(in srgb,var(--c) 22%,transparent)}

/* savings total */
.total-saved{margin-top:14px;padding:14px 16px;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 26%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent)}
.ts-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ts-head span:last-child{letter-spacing:0;text-transform:none;color:var(--faint)}
.ts-big{margin-top:6px;font-size:30px;font-weight:700;letter-spacing:-.01em;color:var(--c);font-variant-numeric:tabular-nums}
.ts-split{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:14px;color:var(--muted)}
.ts-split b{color:var(--text);font-weight:600}
.ts-split i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* ---------- recap ---------- */
.recap{--c:var(--accent)}
.recap .card-head svg{width:22px;height:22px;color:var(--accent)}
.recap-summary{margin-top:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);font-size:14px;line-height:1.45}
.recap-list{display:flex;flex-direction:column;margin-top:6px}
.ins{--c:var(--accent);display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--sep)}
.ins:first-child{border-top:0}
.ins.tone-bad{--c:var(--over)}.ins.tone-warn{--c:var(--savings)}.ins.tone-good{--c:var(--accent)}.ins.tone-info{--c:var(--wants)}
.ins-body{flex:1;min-width:0}
.ins-t{font-size:16px;font-weight:700}
.ins-x{margin-top:3px;font-size:14px;color:var(--muted);line-height:1.45}
.ins-tip{margin-top:8px;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--c) 9%,transparent);font-size:13.5px;line-height:1.45}
.ins-tip b{color:var(--c);margin-right:4px}
.recap-empty{padding:12px 0 4px;font-size:14px;color:var(--faint)}
.link-btn{width:100%;height:44px;margin-top:4px;border:0;border-top:1px solid var(--sep);background:transparent;color:var(--accent);font-size:15px;font-weight:700}

/* ---------- buttons ---------- */
.btn{height:46px;padding:0 16px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);font-size:16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--over) 45%,transparent);color:var(--over)}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* ---------- sheets ---------- */
dialog.sheet{border:1px solid var(--line);background:var(--surface);color:var(--text);
  width:100%;max-width:560px;max-height:90vh;max-height:90dvh;padding:0;margin:auto auto 0;border-radius:24px 24px 0 0}
dialog.sheet::backdrop{background:var(--scrim)}
@media (min-width:620px){dialog.sheet{margin:auto;border-radius:24px}}
.sheet-body{padding:16px 18px calc(env(safe-area-inset-bottom) + 24px);overflow-y:auto;max-height:90vh;max-height:90dvh}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head h2{font-size:26px;font-weight:700}
.sheet h3{font-size:19px;font-weight:700;margin:26px 0 8px}
.hint{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.hint.warn{color:var(--savings)}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--accent);-webkit-appearance:radio;appearance:auto;padding:0;border:0;box-shadow:none}
.opt .r{font-size:18px;font-weight:700}
.opt .d{font-size:13px;color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.font-onest .r{font-family:"Onest",var(--system)}
.opt.font-system .r{font-family:var(--system)}
.pal{display:flex;gap:4px;margin-left:auto}
.pal i{width:14px;height:14px;border-radius:50%}
.segmented{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);margin-bottom:12px}
.segmented label{flex:1;position:relative}
.segmented input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.segmented span{display:flex;align-items:center;justify-content:center;height:40px;border-radius:10px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;padding:0 6px}
.segmented input:checked + span{background:var(--surface);color:var(--text);box-shadow:0 1px 4px var(--shadow)}
.custom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.custom label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.sum{font-size:14px;color:var(--muted);margin-bottom:12px}
.sum.bad{color:var(--over)}.sum.ok{color:var(--accent)}
input,select{font-size:16px;color:var(--text);width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  height:48px;padding:0 14px;min-width:0;outline:none;-webkit-appearance:none;appearance:none}
.custom input{text-align:center}
input::placeholder{color:var(--faint)}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 21px,calc(100% - 17px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;font-size:14px;color:var(--muted)}
.field input{font-size:18px}
#edAmount{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.field-label{display:block;margin-bottom:7px;font-size:14px;color:var(--muted)}
.name-row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.icon-pick{width:48px;height:48px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--accent)}
.icon-pick svg{width:24px;height:24px}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:-4px 0 14px;padding:10px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.icon-grid button{height:46px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);display:grid;place-items:center}
.icon-grid button svg{width:22px;height:22px}
.icon-grid button.sel{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.icon-grid button.auto{font-size:12px;font-weight:700}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-bottom:16px;border-radius:14px;border:1px solid var(--line);font-size:16px;cursor:pointer}
.switch-row small{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
input.switch{width:51px;height:31px;flex:none;padding:0;border-radius:999px;border:0;background:var(--faint);position:relative;cursor:pointer;transition:background-color .2s;box-shadow:none;opacity:.9}
input.switch::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
input.switch:checked{background:var(--accent);opacity:1}
input.switch:checked::before{transform:translateX(20px)}
input.switch:focus{box-shadow:none;border:0}
.ver{margin-top:24px;font-size:13px;color:var(--faint);text-align:center}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:700;transition:opacity .25s,transform .25s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Liquid Glass ---------- */
html:has(body.glass){background:var(--g-base)}
body.glass{background:transparent}
body.glass::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(55% 32% at 12% 6%,var(--blob1),transparent 70%),
    radial-gradient(48% 30% at 95% 34%,var(--blob2),transparent 70%),
    radial-gradient(50% 30% at 4% 72%,var(--blob3),transparent 70%),
    radial-gradient(55% 34% at 90% 96%,var(--blob4),transparent 70%),
    var(--g-base)}
body.glass .card{border-radius:30px;
  background:radial-gradient(120% 70% at 0% 0%,var(--g-hi),transparent 50%),linear-gradient(160deg,var(--g-1) 0%,var(--g-2) 55%,var(--g-3) 100%);
  border:1px solid var(--g-line);
  -webkit-backdrop-filter:blur(28px) saturate(175%);backdrop-filter:blur(28px) saturate(175%);
  box-shadow:inset 0 1px 0 var(--g-inset),0 20px 40px -14px var(--g-shadow)}
body.glass .hero{background:radial-gradient(120% 70% at 0% 0%,var(--g-hi),transparent 50%),
  linear-gradient(160deg,color-mix(in srgb,var(--accent) 24%,transparent) 0%,color-mix(in srgb,var(--accent) 6%,transparent) 55%,var(--g-3) 100%);
  border-color:color-mix(in srgb,var(--accent) 30%,var(--g-line))}
body.glass .cat{background:radial-gradient(120% 70% at 0% 0%,var(--g-hi),transparent 50%),
  linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,transparent) 0%,color-mix(in srgb,var(--c) 7%,transparent) 55%,var(--g-3) 100%);
  border-color:color-mix(in srgb,var(--c) 30%,var(--g-line))}
body.glass .items{border-radius:20px;border-color:color-mix(in srgb,var(--c) 14%,var(--g-line));--row:color-mix(in srgb,var(--c) 9%,var(--g-row))}
body.glass .item.sub .item-inner{background:color-mix(in srgb,var(--c) 5%,var(--g-row-sub))}
body.glass .icon-btn,body.glass .month-label{background:linear-gradient(180deg,var(--g-btn-1),var(--g-btn-2));border:1px solid var(--g-line);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--g-inset),0 8px 20px -10px var(--g-shadow)}
body.glass .icon-btn{border-radius:50%}
body.glass .month-label{border-radius:999px}
body.glass input,body.glass select{background-color:var(--g-input);border-color:var(--g-input-line);border-radius:15px}
body.glass input.switch{background-color:var(--faint);border-radius:999px}
body.glass input.switch:checked{background-color:var(--accent)}
body.glass .btn{border-radius:999px}
body.glass .btn:not(.primary):not(.danger){background:var(--g-btn-2);border-color:var(--g-line);box-shadow:inset 0 1px 0 var(--g-inset)}
body.glass .btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
body.glass .chip{box-shadow:inset 0 1px 0 var(--g-inset)}
body.glass .add-btn{border-radius:999px;box-shadow:inset 0 1px 0 var(--g-inset)}
body.glass .total-saved,body.glass .recap-summary{border-radius:20px}
body.glass .stack{background:color-mix(in srgb,var(--text) 8%,transparent)}
body.glass .ring .track{stroke:color-mix(in srgb,var(--text) 10%,transparent)}
body.glass dialog.sheet{background:var(--g-sheet);border:1px solid var(--g-line);border-radius:32px 32px 0 0;
  -webkit-backdrop-filter:blur(34px) saturate(170%);backdrop-filter:blur(34px) saturate(170%);box-shadow:inset 0 1px 0 var(--g-inset)}
@media (min-width:620px){body.glass dialog.sheet{border-radius:32px}}
body.glass dialog.sheet::backdrop{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.glass .opt,body.glass .switch-row{border-radius:20px;background:var(--g-2);border-color:var(--g-line)}
body.glass .opt:has(input:checked){background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
body.glass .segmented{border-radius:999px;background:var(--g-2);border-color:var(--g-line)}
body.glass .segmented span{border-radius:999px}
body.glass .icon-grid,body.glass .icon-pick{background:var(--g-2);border-color:var(--g-line)}
body.glass .toast{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 26px -8px color-mix(in srgb,var(--accent) 60%,transparent)}

/* ---------- loading screen ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:var(--splash);transition:opacity .4s ease,visibility 0s .4s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash .pig{width:150px;height:auto;overflow:visible;color:var(--accent);animation:pigIn .3s ease-out both}
#splash .jump{transform-box:fill-box;transform-origin:50% 100%;animation:pigJump 1s .25s both}
#splash .shake{transform-box:fill-box;transform-origin:50% 60%;animation:pigRing .62s .37s both}
#splash .ground{transform-box:fill-box;transform-origin:50% 50%;animation:groundHit 1s .25s both}
#splash .eye-dot{transform-box:fill-box;transform-origin:50% 50%;animation:eyeDot 1s .25s both}
#splash .eye-happy{transform-box:fill-box;transform-origin:50% 100%;animation:eyeHappy 1s .25s both}
#splash .splash-name{font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--text);opacity:0;animation:fadeUp .45s ease .2s forwards}
@keyframes pigIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pigJump{
  0%  {transform:translateY(0) scale(1,1);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  12% {transform:translateY(0) scale(1.06,.92);animation-timing-function:cubic-bezier(.25,.8,.4,1)}
  20% {transform:translateY(-14px) scale(.97,1.05);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  38% {transform:translateY(-34px) scale(.99,1.01);animation-timing-function:cubic-bezier(.3,0,.7,1)}
  48% {transform:translateY(-38px) scale(1,1);animation-timing-function:cubic-bezier(.3,0,.7,1)}
  58% {transform:translateY(-33px) scale(1,1.01);animation-timing-function:cubic-bezier(.55,0,1,.6)}
  73% {transform:translateY(0) scale(.98,1.03);animation-timing-function:cubic-bezier(0,.5,.4,1)}
  80% {transform:translateY(0) scale(1.07,.92);animation-timing-function:cubic-bezier(.4,0,.4,1)}
  89% {transform:translateY(0) scale(.985,1.02);animation-timing-function:cubic-bezier(.4,0,.4,1)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes groundHit{0%,100%{transform:scaleX(1)}12%{transform:scaleX(.96)}24%{transform:scaleX(1)}73%{transform:scaleX(1)}80%{transform:scaleX(1.06)}92%{transform:scaleX(1)}}
@keyframes pigRing{
  0%  {transform:rotate(0);animation-timing-function:cubic-bezier(.3,.6,.5,1)}
  16% {transform:rotate(14deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  38% {transform:rotate(-12deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  60% {transform:rotate(8deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  80% {transform:rotate(-5deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
  100%{transform:rotate(0)}
}
@keyframes eyeDot{0%,10%{opacity:1;transform:scaleY(1)}15%{opacity:1;transform:scaleY(.15)}16%,72%{opacity:0;transform:scaleY(.15)}73%{opacity:1;transform:scaleY(.15)}80%,100%{opacity:1;transform:scaleY(1)}}
@keyframes eyeHappy{0%,15%{opacity:0;transform:scaleY(.3)}20%{opacity:1;transform:scaleY(1)}68%{opacity:1;transform:scaleY(1)}73%,100%{opacity:0;transform:scaleY(.3)}}
@media (prefers-reduced-motion:reduce){
  #splash .pig,#splash .jump,#splash .shake,#splash .ground,#splash .eye-dot,#splash .splash-name{animation:none;opacity:1}
  #splash .eye-happy{animation:none;opacity:0}
}
</style>

<div class="app">
  <header class="topbar">
    <h1>MyMONEY</h1>
    <button class="icon-btn" id="openSettings" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/></svg>
      <span class="badge-dot" id="backupDot" hidden></span>
    </button>
  </header>

  <nav class="month-nav">
    <button class="icon-btn" id="prevMonth" data-i18n-aria="prevMonth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="month-label" id="monthLabel" data-i18n-aria="goToday"><span class="m" id="monthText"></span></button>
    <button class="icon-btn" id="nextMonth" data-i18n-aria="nextMonth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </nav>

  <main id="main">
    <section class="card hero">
      <div class="hero-top">
        <div class="eyebrow" data-i18n="monthlyIncome">Monthly income</div>
        <button class="chip" id="schemeChip" data-i18n-aria="budgetRule"></button>
      </div>
      <div class="big" id="incomeTotal">0</div>
      <div class="stack" aria-hidden="true">
        <span class="seg needs" data-seg="needs"></span><span class="seg wants" data-seg="wants"></span><span class="seg savings" data-seg="savings"></span>
      </div>
      <div class="legend" id="legend"></div>
      <div class="unalloc" id="unalloc"></div>
      <div class="sub-title" data-i18n="incomeSources">Income sources</div>
      <div class="items" data-list="income"></div>
      <div class="chips" data-chips="income" hidden></div>
      <button class="add-btn" data-add="income"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addIncome">Add income</span></button>
    </section>

  const target = c => round2(t.income * sc[c] / 100);
  const prevKeys = Object.keys(state.months).filter(k => k < cur && hasData(state.months[k])).sort().slice(-3);
  const groups = groupStats(m);

  // 1. category over its target
  for (const c of ['needs', 'wants']) {
    const d = round2(t[c] - target(c));
    if (t.income && d > 0) out.push({ tone: 'bad', icon: 'alert', score: c === 'wants' ? 96 : 94,
      title: T('insOverTitle', { c: catName(c) }), text: T('insOverText', { x: money(d), p: sc[c] }), tip: T(c === 'wants' ? 'tipOverWants' : 'tipOverNeeds') });
  }
  // 2. pace: projected end-of-month Wants = spent ÷ days passed × days in month
  if (isNow && day >= 5 && day <= daysIn - 3 && t.income && t.wants > 0 && t.wants <= target('wants')) {
    const proj = round2(t.wants / day * daysIn);
    if (proj > target('wants') * 1.05) out.push({ tone: 'warn', icon: 'up', score: 85,
      title: T('insPaceTitle'), text: T('insPaceText', { x: money(proj), y: money(round2(proj - target('wants'))) }), tip: T('tipPace') });
  }
  // 3. small purchases that add up: yearly ≈ average price × purchases per month × 12
  for (const g of groups) {
    if (g.recurring || g.count < 3) continue;
    const avg = g.total / g.count; if (avg > 15) continue;
    const perMonth = isNow && day > 0 ? g.count / day * daysIn : g.count;
    const yearly = Math.round(avg * perMonth * 12);
    out.push({ tone: 'info', icon: g.icon, score: 70 + Math.min(15, yearly / 60),
      title: T('insSmallTitle', { n: g.name }), text: T('insSmallText', { k: g.count, x: money(g.total), a: money(round2(avg)), y: money(yearly) }),
      tip: tipFor(g.icon, Math.round(yearly / 3)) });
  }
  // 4. trend: change = (this month − average of the last months) ÷ that average
  if (prevKeys.length) for (const g of groups) {
    if (g.recurring) continue;
    const hist = prevKeys.map(k => groupTotal(state.months[k], g.key)).filter(v => v > 0);
    if (!hist.length) continue;
    const avg = hist.reduce((a, b) => a + b, 0) / hist.length;
    if (avg < 20) continue;
    const ch = (g.total - avg) / avg;
    if (ch >= 0.25) out.push({ tone: 'warn', icon: 'up', score: 80,
      title: T('insUpTitle', { n: g.name }), text: T('insUpText', { x: money(g.total), p: Math.round(ch * 100), a: money(round2(avg)) }), tip: tipFor(g.icon, 0) });
    else if (done && ch <= -0.2) out.push({ tone: 'good', icon: 'down', score: 55,
      title: T('insDownTitle', { n: g.name }), text: T('insDownText', { x: money(g.total), p: Math.round(-ch * 100) }) });
  }
  // 5. savings rate = savings ÷ income
  if (t.income) {
    const rate = t.savings / t.income, tr = sc.savings / 100;
    const prevRates = prevKeys.map(k => { const tt = totals(state.months[k]); return tt.income ? tt.savings / tt.income : 0; });
    if (t.savings > 0 && rate >= tr) {
      const best = prevRates.length > 0 && rate > Math.max(...prevRates);
      out.push({ tone: 'good', icon: 'piggy', score: best ? 72 : 60,
        title: T('insSaveGoodTitle', { p: pct(rate) }), text: T(best ? 'insSaveBest' : 'insSaveGood', { t: sc.savings }), tip: T('tipSaveGood') });
    } else if (late) {
      out.push({ tone: 'warn', icon: 'piggy', score: 82,
        title: T('insSaveLowTitle', { p: pct(rate) }), text: T('insSaveLowText', { x: money(round2(target('savings') - t.savings)), t: sc.savings }), tip: T('tipSaveLow') });
    }
  }
  // 6. recurring costs
  const rec = [...m.needs, ...m.wants].filter(i => i.recurring);
  if (rec.length >= 2) {
    const tot = sum(rec);
    out.push({ tone: 'info', icon: 'repeat', score: 50, title: T('insRecTitle', { x: money(tot) }), text: T('insRecText', { n: rec.length, y: money(round2(tot * 12)) }), tip: T('tipRec') });
  }
  // 7. money without a destination near the end of the month
  if (late && t.income && t.un >= 10) out.push({ tone: 'info', icon: 'piggy', score: 66, title: T('insUnTitle', { x: money(t.un) }), text: T('insUnText'), tip: T('tipUn') });
  // 8. months in a row within the rule
  let streak = 0;
  for (const k of Object.keys(state.months).filter(k => k <= cur).sort().reverse()) {
    const mm = state.months[k], tt = totals(mm);
    if (!tt.income) break;
    const ok = tt.needs <= tt.income * mm.scheme.needs / 100 && tt.wants <= tt.income * mm.scheme.wants / 100;
    if (k === cur && !late) { if (!ok) break; continue; }
    if (ok) streak++; else break;
  }
  if (streak >= 2) out.push({ tone: 'good', icon: 'star', score: 58, title: T('insStreakTitle', { n: streak }), text: T('insStreakText', { n: streak }) });

  out.sort((a, b) => b.score - a.score);
  let summary = null;
  if (late && t.income) {
    const biggest = groups.slice().sort((a, b) => b.total - a.total)[0];
    const within = t.needs <= target('needs') && t.wants <= target('wants');
    summary = T('summary', { m: monthName(cur), p: pct(t.savings / t.income), b: biggest ? `${biggest.name} (${money(biggest.total)})` : '—', w: T(within ? 'sumWithin' : 'sumOver') });
  }
  return { summary, items: out };
}

  $('#currency').value = state.settings.currency;
  const set = (name, v) => $$(`input[name="${name}"]`).forEach(r => { r.checked = r.value === v; });
  set('style', state.settings.style); set('font', state.settings.font); set('theme', state.settings.theme);
  set('palette', state.settings.palette); set('lang', state.settings.lang);
  $('#rtNote').hidden = !rtMQ.matches;
  const b = backupState();
  $('#lastExport').textContent = b.text;
  $('#lastExport').classList.toggle('warn', b.due);
}
function openSettings(focusRule) {
  applyLang(); fillSettings();
  openDlg(dlg);
  if (focusRule) $('#ruleTitle').scrollIntoView({ block: 'start' });
  else dlg.querySelector('.sheet-body').scrollTop = 0;
}
$('#openSettings').onclick = () => openSettings(false);
$('#schemeChip').onclick = () => openSettings(true);
$('#closeSettings').onclick = () => closeDlg(dlg);

function renderSchemeList() {
  const sc = view().scheme;
  const preset = PRESETS.find(p => p.id !== 'custom' && p.n === sc.needs && p.w === sc.wants && p.s === sc.savings);
  const sel = preset ? preset.id : 'custom';
  $('#schemeList').innerHTML = PRESETS.map(p => `
    <label class="opt">
      <input type="radio" name="scheme" value="${p.id}" ${p.id === sel ? 'checked' : ''}>
      <span><span class="r">${p.id === 'custom' ? esc(T('custom')) : `${p.n} / ${p.w} / ${p.s}`}</span><br><span class="d">${esc(T(p.d))}</span></span>
    </label>`).join('');
  $('#cNeeds').value = sc.needs; $('#cWants').value = sc.wants; $('#cSavings').value = sc.savings;
  updateCustom();
}
const customValues = () => ['#cNeeds', '#cWants', '#cSavings'].map(s => Math.round(parseAmount($(s).value)));
function updateCustom() {
  const isCustom = ($('input[name="scheme"]:checked') || {}).value === 'custom';
  $('#customBox').hidden = !isCustom;
  const [n, w, s] = customValues(), total = n + w + s, el = $('#cSum');
  el.textContent = total === 100 ? T('total100') : T('totalBad', { n: total });
  el.className = 'sum ' + (total === 100 ? 'ok' : 'bad');
  $('#applyScheme').disabled = isCustom && total !== 100;
}
$('#schemeList').addEventListener('change', updateCustom);
$('#customBox').addEventListener('input', updateCustom);
$('#applyScheme').onclick = () => {
  const sel = ($('input[name="scheme"]:checked') || {}).value;
  let sc;
  if (sel === 'custom') {
    const [n, w, s] = customValues();
    if (n + w + s !== 100) return;
    sc = { id: 'custom', needs: n, wants: w, savings: s };
  } else {
    const p = PRESETS.find(p => p.id === sel); if (!p) return;
    sc = { id: p.id, needs: p.n, wants: p.w, savings: p.s };
  }
  state.settings.defaultScheme = { ...sc };
  const m = getMonth(); if (m) m.scheme = { ...sc };
  save(); closeDlg(dlg); renderAll(); toast(T('ruleSet', { r: `${sc.needs}/${sc.wants}/${sc.savings}` }));
};
const onPick = (id, field, after) => $(id).addEventListener('change', e => {
  if (!e.target.name) return;
  state.settings[field] = e.target.value; save(); after();
});
onPick('#styleList', 'style', applyLook);
onPick('#fontList', 'font', applyLook);
onPick('#themeList', 'theme', applyLook);
onPick('#paletteList', 'palette', applyLook);
onPick('#langList', 'lang', () => { renderAll(); applyLang(); fillSettings(); });
$('#currency').onchange = e => { state.settings.currency = e.target.value; save(); renderAll(); };

/* ---------- save file: export / import ---------- */
async function exportData() {
  const stamp = new Date().toISOString().slice(0, 10);
  const name = `mymoney-save-${stamp}.json`;
  const json = JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2);
  const file = new File([json], name, { type: 'application/json' });
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'MyMONEY' }); markExported(); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markExported();
}
function markExported() {
  state.meta.lastExport = new Date().toISOString();
  save(); closeDlg(dlg); renderMeta(); toast(T('exported'));
}
$('#exportBtn').onclick = exportData;
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || data.app !== APP_ID || typeof data.months !== 'object') throw new Error('not a save file');
    const incoming = normalize(data);
    const n = Object.keys(incoming.months).length;
    if (!confirm(T('importConfirm', { f: f.name, n }))) return;
    incoming.meta.lastExport = state.meta.lastExport;
    state = incoming; save(); closeDlg(dlg); renderAll(); toast(T('imported'));
  } catch (err) {
    alert(T('importError'));
  }
};
$('#resetBtn').onclick = () => {
  if (!confirm(T('confirmReset'))) return;
  state = normalize({ settings: state.settings }); save(); closeDlg(dlg); renderAll(); toast(T('allDeleted'));
};

/* =====================================================================
   Boot
   ===================================================================== */
renderAll();
const splash = $('#splash');
function hideSplash() { if (!splash || splash.classList.contains('hide')) return; splash.classList.add('hide'); setTimeout(() => splash.remove(), 500); }
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(hideSplash, reduceMotion ? 450 : 1500);
splash.addEventListener('click', hideSplash);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();

</script>
</body>
